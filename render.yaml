services:
  - type: web
    name: doctor-matching-agent-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: cd apps/api && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: AGENT_DATABASE_URL
        fromDatabase:
          name: doctor-matching-agent-memory
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://doctor-matching-agent-web.onrender.com
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: doctor-matching-agent-web
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/out
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://doctor-matching-agent-api.onrender.com

databases:
  - name: doctor-matching-agent-memory
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: doctor_matching_agent_memory
    user: doctor_matching_agent_memory_user
    ipAllowList: []
