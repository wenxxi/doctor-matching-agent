services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: security_test
      POSTGRES_USER: security_test
      POSTGRES_PASSWORD: disposable_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_test -d security_test"]
      interval: 2s
      timeout: 3s
      retries: 30
